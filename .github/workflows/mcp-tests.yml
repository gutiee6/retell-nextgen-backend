name: Read-only MCP tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/requirements.txt
      - name: Install MCP dependencies
        run: python -m pip install -r mcp/requirements.txt
      - name: Compile MCP source and tests
        run: python -m compileall -q mcp
      - name: Run synthetic offline tests
        env:
          PYTHONPATH: mcp
        run: python -m unittest discover -s mcp/tests -v
